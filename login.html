<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | PagNav 2.0</title>
    
    <!-- Icono de Pestaña (Favicon) -->
    <link rel="icon" type="image/png" href="assets/icono%20de%20la%20app-64x64.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#09090b">
    
    <!-- Estructura y Temas -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" id="theme-link" href="css/themes/modern_dark.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Efectos de fondo heredados -->
    <div class="fireflies-layer"></div>
    <div class="surface-glow"></div>

    <div class="login-card">
        <div class="login-logo">
            <i class="fas fa-rocket"></i>
        </div>
        <h2>PagNav 2.0</h2>
        <p>Tu dashboard personal, sincronizado en la nube.</p>
        
        <button id="login-google" class="google-btn">
            <i class="fab fa-google"></i>
            Continuar con Google
        </button>
    </div>

    <script type="module">
        import Auth from "./js/auth.js";
        import Store from "./js/store.js";

        // Cargar el tema preferido incluso antes de loguear
        async function init() {
            const theme = await Store.getTheme();
            const modularThemes = [
                'modern_dark', 'minimalist_white', 'industrial_gold', 'luxury_onyx',
                'lava', 'glitch_void', 'neon_jungle', 'ice_kingdom', 'jojos', 
                'cyberpunk_red', 'abyssal_deep', 'galactic_horizon', 'arcane_academy', 'dragon_lair',
                'synthwave', 'samurai', 'rapture', 'gothic', 'emerald_forest', 
                'cybercore', 'desert_mirage', 'fallout', 'celestial', 'shadow_realm',
                'mars_colony', 'liminal_space', 'candy_land', 'pirate_cove', 'ancient_egypt',
                'cyber_city', 'viking_runes', 'doodle_sketch', 'toxic_slime'
            ];

            const isModular = modularThemes.includes(theme.themeName);
            const themePath = isModular 
                ? `css/themes/${theme.themeName}/main.css` 
                : `css/themes/${theme.themeName}.css`;

            document.getElementById('theme-link').href = themePath;
            document.body.classList.add(`theme-${theme.themeName}`);
        }
        init();

        // Si ya está logueado, mandarlo al index
        Auth.checkSession((user) => {
            if (user) window.location.href = "index.html";
        });

        document.getElementById('login-google').onclick = () => {
            Auth.login();
        };

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
